name: Live smoke test (Muse Spark, Meta or Baseten)

# Calls the real model, so it costs tokens: manual trigger only, never on push.
# Needs a repository secret (Settings > Secrets and variables > Actions): META_API_KEY for the
# Meta Model API, or BASETEN_API_KEY for the open-weights Muse Spark Open on Baseten.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Where Muse Spark runs
        type: choice
        options: [meta, baseten]
        default: meta

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      META_API_KEY: ${{ secrets.META_API_KEY }}
      BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
      LLM_PROVIDER: ${{ inputs.provider }}
      MAX_TOKENS: "8192"
      MAX_RETRIES: "2"
    steps:
      - name: Check that the secret is set
        run: |
          if [ "$LLM_PROVIDER" = "baseten" ]; then key="$BASETEN_API_KEY"; name=BASETEN_API_KEY
          else key="$META_API_KEY"; name=META_API_KEY; fi
          if [ -z "$key" ]; then
            echo "::error::Add a $name repository secret to run this workflow."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: VLAN provisioning on Muse Spark
        run: netops-copilot "Create VLAN 30 named users on site-a and site-b" --yes

      - name: ACL audit on Muse Spark (must find the 4 known violations)
        run: |
          set -o pipefail
          code=0
          netops-copilot "Telnet and SMB must be blocked and HTTPS allowed on all edge ACLs" | tee audit.txt || code=$?
          test "$code" -eq 3
          grep -q "NON-COMPLIANT (4 of 9 checks failed)" audit.txt

      - name: ACL auto-fix on Muse Spark
        run: |
          netops-copilot "Fix the edge ACLs: telnet and SMB must be blocked and HTTPS allowed" --yes

      - name: Vision on Muse Spark - the model reads the whiteboard pixels (no metadata used)
        env:
          NETOPS_STATE_DIR: ${{ runner.temp }}/vision
        run: |
          set -o pipefail
          netops-copilot --image src/netops_copilot/web/static/examples/whiteboard.png --yes | tee board.txt
          grep -q "vlan_provision, targets=\['site-b'\]" board.txt
          grep -qi "name CAMERAS" board.txt

      - name: Agent on Muse Spark - function calling with read-only tools
        env:
          NETOPS_STATE_DIR: ${{ runner.temp }}/agent
        run: |
          set -o pipefail
          netops-copilot --agent "Make sure VLAN 20 VOICE exists on every device" --yes | tee agent.txt
          grep -q "tool  ok  " agent.txt
          grep -q "targets=\['core'\]" agent.txt

      - name: Independent reviewer on the real model - escalation is never auto-approved
        env:
          NETOPS_STATE_DIR: ${{ runner.temp }}/review
        run: |
          code=0
          netops-copilot "Fix the edge ACLs: telnet and SMB must be blocked and HTTPS allowed" --yes > review.txt || code=$?
          cat review.txt
          grep -q "^Review  : " review.txt
          if grep -q "Review  : ESCALATE" review.txt; then test "$code" -eq 2; else test "$code" -eq 0; fi
