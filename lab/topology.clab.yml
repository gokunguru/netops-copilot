# Minimal 3-site lab for dry-runs, built for the hackathon.
name: netops-copilot

topology:
  defaults:
    kind: linux
    image: quay.io/frrouting/frr:10.1.0
  nodes:
    site-a:
    site-b:
    core:
  links:
    - endpoints: ["site-a:eth1", "core:eth1"]
    - endpoints: ["site-b:eth1", "core:eth2"]
