[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netops-copilot"
version = "0.1.0"
description = "AI agent that turns network change requests into validated multi-vendor configs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kamil Mandi" }]
dependencies = [
  "pydantic>=2",
  "httpx>=0.27",
  "python-dotenv>=1",
  "pyyaml>=6",
]

[project.scripts]
netops-copilot = "netops_copilot.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
